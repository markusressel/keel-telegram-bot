keel-telegram-bot:
  # Determines the log level of the application, one of: debug, info, warning, error, fatal, panic
  log_level: warning

  # Keel specific configuration options
  keel:
    # Hostname of the Keel instance
    host: localhost
    # Port of the Keel instance
    port: 9300
    # Whether to use TLS when communicating with Keel
    ssl: true
    # Username to use when authenticating with Keel
    username: myuser
    # Password to use when authenticating with Keel
    password: mypassword

  # Approval Monitor specific configuration options
  monitor:
    # Interval to check for pending approvals
    interval: 10s

  # Telegram specific configuration options
  telegram:
    # List of Telegram usernames that are allowed to approve updates
    admin_usernames:
      - myadminuser
      - myotheradminuser
    # Telegram bot token
    bot_token: 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
    # List of Telegram chat IDs to send notifications to
    chat_ids:
      - 12345678
      - 87654321
    # List of filters to apply before sending notifications and responding to bot commands
    filters:
      - chat_id: 12345678
        identifier: ".*something.*"

  # Helm chart update specific configuration options (HelmChart objects of the k3s helm-controller)
  helm_charts:
    # Whether to check HelmCharts for new chart versions, requires additional RBAC rules (see README)
    enabled: false
    # Interval to check for new chart versions
    interval: 24h
    # Namespace of the HelmChart objects
    namespace: kube-system
    # Names of HelmCharts to check, all HelmCharts if empty
    allow: []
    # Names of HelmCharts to never check
    deny:
      - prometheus
    # File to remember announced and ignored chart versions in, put it on a persistent volume
    state_path: /app/data/helm-chart-state.json
    # Maximum time to wait for the helm-controller install job after an upgrade
    job_timeout: 10m

  # Prometheus exporter specific configuration options
  stats:
    # Whether to enable the Prometheus exporter
    enabled: true
    # Port to provide Prometheus metrics on
    port: 8000